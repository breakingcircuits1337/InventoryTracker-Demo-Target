# L2L[TRANSFORM]: Migrated to Spring Boot 3.2 property keys

# DataSource — HikariCP (replaces commons-dbcp BasicDataSource)
spring.datasource.url=jdbc:h2:file:./data/inventorydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=inventory2009
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=20

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Application
app.pageSize=25
app.exportEnabled=true
app.lowStockThreshold=10
